name: Build and publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag (defaults to the branch name)
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: Released version without the v prefix
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$INPUT_VERSION" ]; then
            tags="${image}:${INPUT_VERSION},${image}:latest"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$version" = "latest" ]; then
              echo "::error::Manual builds cannot move latest"
              exit 1
            fi
            tags="${image}:${version}"
          else
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version},${image}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Read Gladys manifest
        id: manifest
        run: echo "json=$(jq -c . gladys-assistant-integration.json)" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GLADYS_INTEGRATION_MANIFEST=${{ steps.manifest.outputs.json }}
