name: Build and publish image

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag (defaults to the branch name)
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: Released version (for example 1.0.1)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version != '' && inputs.version || '' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release=true
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            tags="${image}:${INPUT_VERSION},${image}:latest"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release=false
            version="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$version" = "latest" ]; then
              echo "::error::Manual builds cannot move latest"
              exit 1
            fi
            tags="${image}:${version}"
          else
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the X.Y.Z format (for example 1.0.1)"
              exit 1
            fi
            tags="${image}:${version},${image}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Read Gladys manifest
        id: manifest
        run: echo "json=$(jq -c . gladys-assistant-integration.json)" >> "$GITHUB_OUTPUT"
      - name: Validate released versions
        if: steps.meta.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          expected_image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION}"
          package_version="$(jq -r .version package.json)"
          manifest_version="$(jq -r .version gladys-assistant-integration.json)"
          manifest_image="$(jq -r .docker_image gladys-assistant-integration.json)"
          if [ "$package_version" != "$RELEASE_VERSION" ] || \
             [ "$manifest_version" != "$RELEASE_VERSION" ] || \
             [ "$manifest_image" != "$expected_image" ]; then
            echo "::error::Tag, package version, manifest version and docker_image must all match ${RELEASE_VERSION}"
            exit 1
          fi
      - name: Build and push amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GLADYS_INTEGRATION_MANIFEST=${{ steps.manifest.outputs.json }}
