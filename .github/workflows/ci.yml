name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: |
          mkdir -p reports/tests
          npm test -- --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/tests/junit.xml
      - name: Upload test report
        if: always() && hashFiles('reports/tests/junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tests-unitaires-integration
          path: reports/tests/junit.xml
          retention-days: 1
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
      - name: Build and verify isolated Docker runtime
        run: node scripts/docker-smoke.mjs
